<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HSK2 集中学習</title>

<!-- PWA / iOS ホーム画面対応 -->
<meta name="theme-color" content="#2C3E66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSK2">
<link rel="manifest" href="manifest.json">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #EDEFF2;
  }
  :root {
    --paper: #EDEFF2;
    --paper-raised: #FFFFFF;
    --ink: #1B1F2A;
    --ink-soft: #5B6472;
    --indigo: #2C3E66;
    --indigo-soft: #DDE3EE;
    --stamp: #C1432E;
    --stamp-soft: #F6DCD6;
    --jade: #3F7A5E;
    --jade-soft: #DCEBE2;
    --gold: #B8863C;
  }

  * { box-sizing: border-box; }

  .hsk-app {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    padding: 20px 16px 32px;
    max-width: 480px;
    margin: 0 auto;
  }

  .hsk-app h1, .hsk-app h2, .hsk-app h3 {
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif;
    margin: 0;
  }

  /* ---------- header ---------- */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand .mark {
    font-size: 28px;
    font-weight: 700;
    color: var(--indigo);
    letter-spacing: 1px;
  }
  .brand .sub {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .streak-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper-raised);
    border: 1px solid var(--indigo-soft);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--indigo);
  }
  .save-status {
    font-size: 11px;
    text-align: center;
    padding: 6px;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .save-status.ok { color: var(--jade); background: var(--jade-soft); }
  .save-status.err { color: var(--stamp); background: var(--stamp-soft); }
  .save-status.pending { color: var(--ink-soft); background: var(--indigo-soft); }

  /* ---------- backup panel ---------- */
  .backup-panel {
    background: var(--paper-raised);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 22px;
  }
  .backup-panel .bp-title {
    font-size: 13px; font-weight: 700; margin-bottom: 4px;
  }
  .backup-panel .bp-desc {
    font-size: 11px; color: var(--ink-soft); margin-bottom: 10px; line-height: 1.5;
  }
  .backup-panel textarea {
    width: 100%;
    font-size: 11px;
    font-family: monospace;
    border: 1px solid var(--indigo-soft);
    border-radius: 8px;
    padding: 8px;
    resize: none;
    color: var(--ink-soft);
    background: var(--paper);
  }
  .bp-row { display: flex; gap: 8px; margin-top: 8px; }
  .bp-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .bp-btn.copy { background: var(--indigo); color: white; }
  .bp-btn.restore { background: var(--jade-soft); color: var(--jade); }
  .bp-toggle {
    background: none; border: none; color: var(--indigo); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0;
  }

  /* ---------- progress bar ---------- */
  .progress-track {
    height: 8px;
    background: var(--indigo-soft);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .progress-fill {
    height: 100%;
    background: var(--indigo);
    border-radius: 999px;
    transition: width 0.5s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  /* ---------- level card ---------- */
  .level-card {
    background: linear-gradient(135deg, var(--indigo), #4a5f94);
    border-radius: 18px;
    padding: 16px 18px;
    color: #fff;
    margin-bottom: 18px;
    box-shadow: 0 4px 14px rgba(44,62,102,0.25);
  }
  .level-card .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .level-card .lv-wrap { display: flex; align-items: baseline; gap: 8px; }
  .level-card .lv { font-size: 22px; font-weight: 700; display: inline-block; }
  .level-card .streak { font-size: 12px; opacity: 0.9; }
  .level-card .xp-num { font-size: 12px; opacity: 0.85; text-align: right; }
  .level-bar-track {
    height: 10px;
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    overflow: hidden;
  }
  .level-bar-fill {
    height: 100%;
    background: #fff;
    border-radius: 999px;
    transition: width 0.7s cubic-bezier(.2,.9,.3,1);
  }
  .level-card.leveling .lv { animation: levelPulse 0.9s ease; }
  @keyframes levelPulse {
    0% { transform: scale(1); }
    35% { transform: scale(1.4); text-shadow: 0 0 14px rgba(255,255,255,0.9); }
    100% { transform: scale(1); }
  }
  .level-up-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    background: var(--gold);
    color: #fff;
    padding: 2px 9px;
    border-radius: 999px;
    opacity: 0;
    animation: levelBadgeIn 2.4s ease forwards;
  }
  @keyframes levelBadgeIn {
    0% { opacity: 0; transform: translateY(4px) scale(0.9); }
    15% { opacity: 1; transform: translateY(0) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .xp-float {
    display: inline-block;
    font-weight: 800;
    color: var(--jade);
    animation: xpFloat 1.3s ease forwards;
  }
  .level-card .xp-float {
    font-size: 15px;
    color: #eaffef;
    text-shadow: 0 1px 3px rgba(0,0,0,0.25);
  }
  .mini-lv .xp-float { font-size: 12px; }
  @keyframes xpFloat {
    0% { opacity: 0; transform: translateY(6px) scale(0.7); }
    18% { opacity: 1; transform: translateY(0) scale(1.25); }
    75% { opacity: 1; transform: translateY(-8px) scale(1); }
    100% { opacity: 0; transform: translateY(-16px) scale(0.95); }
  }
  .level-bar-fill.gained, .mini-bar > div.gained { animation: barFlash 0.6s ease; }

  /* ---------- drill mode ---------- */
  .drill-banner {
    background: var(--stamp-soft);
    color: var(--stamp);
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    padding: 8px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .progress-fill.drill { background: var(--stamp); }
  .flashcard.drill-card .face.front { border: 2px solid var(--stamp-soft); }
  .flashcard.drill-card .face.back { background: var(--stamp); }

  /* ---------- progress screen ---------- */
  .exam-wrong-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .exam-wrong-row {
    background: var(--paper-raised); border-radius: 12px; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .exam-wrong-row .zh { font-size: 14px; font-weight: 600; }
  .exam-wrong-row .meta { font-size: 12px; color: var(--ink-soft); text-align: right; }
  .exam-disclaimer { font-size: 11px; color: var(--ink-soft); text-align: center; margin-top: 10px; line-height: 1.6; }
  @keyframes barFlash {
    0% { filter: brightness(1); }
    40% { filter: brightness(1.6); }
    100% { filter: brightness(1); }
  }

  /* ---------- home ---------- */
  .section-title {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 10px 2px;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 26px;
  }
  .mode-card {
    background: var(--paper-raised);
    border-radius: 18px;
    padding: 18px 14px;
    text-align: left;
    border: none;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(27,31,42,0.06);
  }
  .mode-card .icon { font-size: 26px; display: block; margin-bottom: 10px; }
  .mode-card .title { font-size: 16px; font-weight: 700; color: var(--ink); }
  .mode-card .desc { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }

  .cat-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--paper-raised);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .cat-row.active { border-color: var(--indigo); }
  .cat-row .name { font-weight: 600; font-size: 14px; }
  .cat-row .count { font-size: 12px; color: var(--ink-soft); }
  .cat-row .mini-progress {
    width: 60px; height: 5px; background: var(--indigo-soft); border-radius: 999px; overflow: hidden; margin-top: 6px;
  }
  .cat-row .mini-progress > div { height: 100%; background: var(--jade); }

  .start-btn {
    width: 100%;
    background: var(--indigo);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .start-btn:disabled { opacity: 0.4; cursor: default; }

  /* ---------- flashcard ---------- */
  .study-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .back-link {
    background: none; border: none; color: var(--ink-soft); font-size: 14px; cursor: pointer; padding: 4px;
  }
  .deck-pos { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .mini-lv {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; color: var(--indigo);
  }
  .mini-lv .mini-bar {
    width: 46px; height: 6px; background: var(--indigo-soft); border-radius: 999px; overflow: hidden;
  }
  .mini-lv .mini-bar > div { height: 100%; background: var(--indigo); transition: width 0.5s ease; }
  .mini-lv.leveling { animation: levelPulse 0.9s ease; }

  .flashcard-wrap {
    perspective: 1200px;
    margin-bottom: 20px;
  }
  .flashcard {
    position: relative;
    height: 260px;
    border-radius: 22px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.2,.9,.3,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .face.front {
    background: var(--paper-raised);
    box-shadow: 0 4px 18px rgba(27,31,42,0.08);
  }
  .face.back {
    background: var(--indigo);
    color: white;
    transform: rotateY(180deg);
  }
  .hanzi { font-size: 56px; font-weight: 700; font-family: "Hiragino Mincho ProN","Noto Serif JP",serif; }
  .pinyin { font-size: 18px; color: var(--ink-soft); margin-top: 10px; }
  .tap-hint { font-size: 11px; color: var(--ink-soft); position: absolute; bottom: 14px; }
  .meaning { font-size: 24px; font-weight: 700; }
  .category-tag {
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    margin-top: 8px;
  }

  .rate-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .rate-btn {
    border: none;
    border-radius: 14px;
    padding: 16px 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .rate-btn.again { background: var(--stamp-soft); color: var(--stamp); }
  .rate-btn.got-it { background: var(--jade-soft); color: var(--jade); }

  /* ---------- quiz ---------- */
  .quiz-progress-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  }
  .quiz-progress-row .progress-track { flex: 1; margin-bottom: 0; }
  .score-badge { font-size: 13px; font-weight: 700; color: var(--jade); white-space: nowrap; }

  .quiz-question {
    background: var(--paper-raised);
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(27,31,42,0.06);
  }
  .quiz-question .hanzi { font-size: 44px; }
  .quiz-question .pinyin { margin-top: 8px; }
  .quiz-prompt { font-size: 12px; color: var(--ink-soft); margin-top: 14px; }

  .option-list { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--paper-raised);
    border: 2px solid var(--indigo-soft);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }
  .option-btn.correct { border-color: var(--jade); background: var(--jade-soft); color: var(--jade); }
  .option-btn.wrong { border-color: var(--stamp); background: var(--stamp-soft); color: var(--stamp); }
  .option-btn:disabled { cursor: default; }

  .next-btn {
    width: 100%;
    background: var(--indigo);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 14px;
  }

  /* ---------- results ---------- */
  .result-wrap { text-align: center; padding: 30px 10px; }
  .result-wrap .big-emoji { font-size: 48px; }
  .result-wrap .result-msg { font-size: 18px; font-weight: 700; margin: 14px 0 4px; }
  .result-wrap .result-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
  .result-stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 26px; }
  .result-stats .stat-num { font-size: 24px; font-weight: 700; color: var(--indigo); }
  .result-stats .stat-label { font-size: 11px; color: var(--ink-soft); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>

  const CATEGORIES = ["すべて", "動詞", "名詞", "形容詞", "副詞・接続詞", "頻出フレーズ"];

  // ---------------------------------------------------------------
  // 状態管理
  // ---------------------------------------------------------------
  let state = {
    screen: "home",       // home | flashcard | quiz | quizResult
    category: "すべて",
    deck: [],
    idx: 0,
    flipped: false,
    known: {},            // { hanzi: true }
    xp: 0,
    streak: 0,
    quiz: { questions: [], idx: 0, score: 0, answered: false, selected: null },
    loaded: false,
    saveStatus: "idle",   // idle | ok | err
    saveError: "",
    backupOpen: false,
    restoreText: "",
    syncCode: null,
    syncStatus: "idle",  // idle | ok | err
    _leveledUp: false,
    _levelUpTimer: null,
    _lastXpGain: null,
    _xpGainTimer: null,
    drillQueue: [],
    drillTotal: 0,
    drillMastered: 0,
  };

  // ---------------------------------------------------------------
  // 端末間同期（Firebase Realtime Database）
  // ---------------------------------------------------------------
  const FIREBASE_DB_URL = "https://hsk2-study-app-default-rtdb.firebaseio.com";

  function pullFromCloud(code) {
    return fetch(FIREBASE_DB_URL + "/hsk2/" + encodeURIComponent(code) + ".json")
      .then((res) => {
        if (!res.ok) throw new Error("network");
        return res.json();
      });
  }

  function pushToCloud() {
    if (!state.syncCode) return Promise.resolve();
    const payload = {
      known: state.known, xp: state.xp, streak: state.streak,
      lastDate: state._lastDate, updatedAt: state._updatedAt || Date.now()
    };
    return fetch(FIREBASE_DB_URL + "/hsk2/" + encodeURIComponent(state.syncCode) + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then((res) => {
      state.syncStatus = res.ok ? "ok" : "err";
      render();
    }).catch(() => {
      state.syncStatus = "err";
      render();
    });
  }

  function syncNow(afterLinking) {
    if (!state.syncCode) return Promise.resolve();
    return pullFromCloud(state.syncCode).then((remote) => {
      const localUpdatedAt = state._updatedAt || 0;
      if (remote && (remote.updatedAt || 0) > localUpdatedAt) {
        state.known = remote.known || {};
        state.xp = remote.xp || 0;
        state.streak = remote.streak || 0;
        state._lastDate = remote.lastDate;
        state._updatedAt = remote.updatedAt;
        persistLocal();
        state.syncStatus = "ok";
        if (afterLinking) showToast("クラウドの進捗を読み込みました ☁️");
        render();
      } else {
        return pushToCloud();
      }
    }).catch(() => {
      state.syncStatus = "err";
      render();
    });
  }

  function generateSyncCode() {
    const alphabet = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
    let code = "";
    for (let i = 0; i < 8; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
    return code;
  }

  function startNewSync() {
    const code = generateSyncCode();
    state.syncCode = code;
    localStorage.setItem("hsk2-sync-code", code);
    state._updatedAt = Date.now();
    persistLocal();
    pushToCloud();
    render();
  }

  function linkSync(rawCode) {
    const code = rawCode.trim().toUpperCase();
    if (code.length < 6 || code.length > 16) {
      showToast("コードの形式が正しくありません");
      return;
    }
    state.syncCode = code;
    localStorage.setItem("hsk2-sync-code", code);
    render();
    syncNow(true);
  }

  function unlinkSync() {
    state.syncCode = null;
    state.syncStatus = "idle";
    localStorage.removeItem("hsk2-sync-code");
    render();
  }

  // ---------------------------------------------------------------
  // 手動バックアップ（コード方式）
  // ---------------------------------------------------------------
  function exportCode() {
    const payload = { known: state.known, xp: state.xp, streak: state.streak, lastDate: state._lastDate };
    try {
      return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    } catch (e) {
      return "";
    }
  }

  function importCode(code) {
    try {
      const json = decodeURIComponent(escape(atob(code.trim())));
      const data = JSON.parse(json);
      state.known = data.known || {};
      state.xp = data.xp || 0;
      state.streak = data.streak || 0;
      state._lastDate = data.lastDate;
      saveProgress();
      showToast("復元しました ✓");
      render();
    } catch (e) {
      showToast("コードが正しくありません");
    }
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }

  // レベルは三角数カーブ（レベルNに到達するには 25*(N-1)*N の累計XPが必要）。
  // 後半のレベルほど必要XPが増え、序盤はすぐレベルが上がってやる気を出しやすくする。
  function levelInfo(xp) {
    let level = 1;
    while (25 * level * (level + 1) <= xp) level++;
    const floorXp = 25 * (level - 1) * level;
    const ceilXp = 25 * level * (level + 1);
    const into = xp - floorXp;
    const span = ceilXp - floorXp;
    return { level, into, span, pct: span > 0 ? Math.min(100, Math.round((into / span) * 100)) : 0 };
  }

  function persistLocal() {
    try {
      localStorage.setItem("hsk2-progress", JSON.stringify({
        known: state.known, xp: state.xp, streak: state.streak,
        lastDate: state._lastDate, updatedAt: state._updatedAt
      }));
    } catch (e) {}
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem("hsk2-progress");
      if (raw) {
        const data = JSON.parse(raw);
        state.known = data.known || {};
        state.xp = data.xp || 0;
        state.streak = data.streak || 0;
        state._lastDate = data.lastDate;
        state._updatedAt = data.updatedAt || 0;
      }
      state.saveStatus = "ok";
    } catch (e) {
      state.saveStatus = "err";
      state.saveError = "この端末では保存機能が使えません（プライベートブラウズ中など）";
    }
    state.syncCode = localStorage.getItem("hsk2-sync-code") || null;
    state.loaded = true;
    render();
    if (state.syncCode) syncNow(false);
  }

  function saveProgress() {
    try {
      const today = todayStr();
      if (state._lastDate !== today) {
        state.streak = state._lastDate ? state.streak + 1 : 1;
        state._lastDate = today;
      }
      state._updatedAt = Date.now();
      persistLocal();
      state.saveStatus = "ok";
    } catch (e) {
      state.saveStatus = "err";
      state.saveError = "保存に失敗しました: " + ((e && (e.message || String(e))) || "不明なエラー");
    }
    render();
    pushToCloud();
  }

  function showToast(msg) {
    const t = document.getElementById("hsk-toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1400);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getFilteredVocab() {
    if (state.category === "すべて") return VOCAB;
    return VOCAB.filter(v => v.c === state.category);
  }

  function categoryProgress(cat) {
    const items = cat === "すべて" ? VOCAB : VOCAB.filter(v => v.c === cat);
    const knownCount = items.filter(v => state.known[v.h]).length;
    return { total: items.length, known: knownCount };
  }

  // ---------------------------------------------------------------
  // アクション
  // ---------------------------------------------------------------
  function startFlashcards() {
    state.deck = shuffle(getFilteredVocab());
    state.idx = 0;
    state.flipped = false;
    state.screen = "flashcard";
    render();
  }

  function startQuiz() {
    const pool = getFilteredVocab();
    if (pool.length < 4) { showToast("このカテゴリはクイズには少なすぎます"); return; }
    const qCount = Math.min(10, pool.length);
    const chosen = shuffle(pool).slice(0, qCount);
    const questions = chosen.map(q => {
      const distractors = shuffle(pool.filter(v => v.h !== q.h)).slice(0, 3);
      const options = shuffle([q, ...distractors]);
      return { q, options };
    });
    state.quiz = { questions, idx: 0, score: 0, answered: false, selected: null };
    state.screen = "quiz";
    render();
  }

  function flipCard() {
    state.flipped = !state.flipped;
    render();
  }

  function gainXp(amount) {
    const before = levelInfo(state.xp).level;
    state.xp += amount;
    const after = levelInfo(state.xp).level;

    state._lastXpGain = amount;
    clearTimeout(state._xpGainTimer);
    state._xpGainTimer = setTimeout(() => { state._lastXpGain = null; render(); }, 1300);

    if (after > before) {
      state._leveledUp = true;
      clearTimeout(state._levelUpTimer);
      state._levelUpTimer = setTimeout(() => { state._leveledUp = false; render(); }, 2400);
    }
  }

  function rateCard(gotIt) {
    const card = state.deck[state.idx];
    if (gotIt) {
      if (!state.known[card.h]) { gainXp(10); }
      state.known[card.h] = true;
    } else {
      delete state.known[card.h];
      gainXp(4);
    }
    saveProgress();
    if (state.idx + 1 < state.deck.length) {
      state.idx += 1;
      state.flipped = false;
      render();
    } else {
      state.screen = "home";
      render();
      showToast("このセットを終えました！お疲れ様でした 🎉");
    }
  }

  function answerQuiz(opt) {
    if (state.quiz.answered) return;
    state.quiz.answered = true;
    state.quiz.selected = opt.h;
    const correct = opt.h === state.quiz.questions[state.quiz.idx].q.h;
    if (correct) {
      state.quiz.score += 1;
      gainXp(15);
      if (!state.known[opt.h]) state.known[opt.h] = true;
    } else {
      gainXp(4);
    }
    saveProgress();
    render();
  }

  function nextQuizQuestion() {
    if (state.quiz.idx + 1 < state.quiz.questions.length) {
      state.quiz.idx += 1;
      state.quiz.answered = false;
      state.quiz.selected = null;
      render();
    } else {
      state.screen = "quizResult";
      render();
    }
  }

  // ---------------------------------------------------------------
  // 特訓モード：まだ覚えていない語だけを、覚えるまで繰り返し出題する
  // ---------------------------------------------------------------
  function buildDrillQueue() {
    const unknown = VOCAB.filter((v) => !state.known[v.h]);
    const pool = shuffle(unknown.length > 0 ? unknown : VOCAB.slice());
    const CAP = 20;
    return pool.slice(0, CAP);
  }

  function startDrill() {
    state.drillQueue = buildDrillQueue();
    state.drillTotal = state.drillQueue.length;
    state.drillMastered = 0;
    state.flipped = false;
    state.screen = "drill";
    render();
  }

  function drillAnswer(gotIt) {
    const card = state.drillQueue[0];
    if (gotIt) {
      if (!state.known[card.h]) { gainXp(10); }
      state.known[card.h] = true;
      state.drillQueue.shift();
      state.drillMastered++;
    } else {
      gainXp(4);
      const removed = state.drillQueue.shift();
      const insertAt = Math.min(state.drillQueue.length, 3);
      state.drillQueue.splice(insertAt, 0, removed);
    }
    saveProgress();
    state.flipped = false;
    if (state.drillQueue.length === 0) {
      state.screen = "home";
      render();
      showToast("特訓完了！" + state.drillMastered + "語をマスターしました 🎯");
    } else {
      render();
    }
  }

  function goHome() {
    state.screen = "home";
    render();
  }

  function selectCategory(cat) {
    state.category = cat;
    render();
  }

  // ---------------------------------------------------------------
  // レンダリング
  // ---------------------------------------------------------------
  function el(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.firstElementChild;
  }

  function miniLevelHtml() {
    const lvl = levelInfo(state.xp);
    return `<div class="mini-lv${state._leveledUp ? " leveling" : ""}">
      Lv.${lvl.level}
      <div class="mini-bar"><div class="${state._lastXpGain ? "gained" : ""}" style="width:${lvl.pct}%"></div></div>
      ${state._lastXpGain ? `<span class="xp-float">+${state._lastXpGain}</span>` : ""}
    </div>`;
  }

  function renderHome() {
    const totalProg = categoryProgress("すべて");
    const pct = Math.round((totalProg.known / totalProg.total) * 100);
    const lvl = levelInfo(state.xp);

      const cpct = prog.total ? Math.round((prog.known/prog.total)*100) : 0;
      return `
        <div class="cat-row ${state.category===cat?'active':''}" data-cat="${cat}">
          <div>
            <div class="name">${cat}</div>
            <div class="mini-progress"><div style="width:${cpct}%"></div></div>
          </div>
          <div class="count">${prog.known}/${prog.total}</div>
        </div>`;
    }).join("");

    const wrap = el(`
      <div>
        <div class="top-bar">
          <div class="brand">
            <span class="mark">汉语</span>

        ${state.saveStatus === "err" ? `<div class="save-status err">⚠️ 自動保存は使えません。下の「進捗コード」で手動バックアップしてください</div>` : ""}
        ${state.saveStatus === "ok" ? `<div class="save-status ok">✓ この端末に保存されています</div>` : ""}

        <div class="level-card${state._leveledUp ? " leveling" : ""}">
          <div class="row">
            <div class="lv-wrap">
              <span class="lv">Lv.${lvl.level}</span>

            </div>
            <div class="xp-num">${lvl.into} / ${lvl.span} XP<br>次のレベルまで ${lvl.span - lvl.into} XP</div>
          </div>

        </div>

          <div class="bp-title">🔗 端末間同期</div>

            <div class="bp-row">
              <button class="bp-btn copy" id="gen-sync">新しいコードを発行</button>
            </div>
            <input type="text" id="sync-input" placeholder="他の端末のコードを入力" maxlength="16"
              style="width:100%;margin-top:10px;padding:12px;border-radius:8px;border:1px solid var(--indigo-soft);font-family:monospace;font-size:16px;text-transform:uppercase;background:var(--paper);color:var(--ink);box-sizing:border-box;">
            <div class="bp-row">
              <button class="bp-btn restore" id="link-sync">このコードで連携する</button>
            </div>
          `}
        </div>

        <div class="backup-panel">
          <div class="bp-title">📋 進捗コード（手動バックアップ）</div>
          <div class="bp-desc">機種変更や別ブラウザに移るときはこちらを使ってください。学習後に「コードをコピー」→メモ帳などに貼り付けて保管。次回開いたら「コードから復元」に貼り付けて読み込むと続きから再開できます。</div>
          ${state.backupOpen ? `
            <textarea readonly rows="3" id="export-area">${exportCode()}</textarea>
            <div class="bp-row">
              <button class="bp-btn copy" id="copy-btn">コードをコピー</button>
            </div>
            <textarea rows="3" placeholder="ここに以前のコードを貼り付け" id="import-area" style="margin-top:10px;"></textarea>
            <div class="bp-row">
              <button class="bp-btn restore" id="restore-btn">コードから復元</button>
            </div>
            <div class="bp-row">
              <button class="bp-toggle" id="close-backup">閉じる</button>
            </div>
          ` : `<button class="bp-toggle" id="open-backup">コードを表示 / 復元する</button>`}
        </div>

        <div class="progress-fill-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">
            全体の習得率 ${pct}%（${totalProg.known}/${totalProg.total}語）
            <button class="bp-toggle" id="open-progress" style="margin-left:6px;">全体の進捗を見る →</button>
          </div>
        </div>

        <div class="section-title">学習モードを選ぶ</div>
        <div class="mode-grid">
          <button class="mode-card drill-mode-card" id="mode-drill" style="grid-column: 1 / -1;">
            <span class="icon">🔥</span>
            <div class="title">特訓モード（これだけ覚える）</div>
            <div class="desc">まだ覚えていない語だけを、覚えるまで繰り返し出題</div>
          </button>
          <button class="mode-card" id="mode-flash">
            <span class="icon">🎴</span>
            <div class="title">フラッシュカード</div>
            <div class="desc">タップしてめくる。覚えた語彙を積み上げる</div>
          </button>
          <button class="mode-card" id="mode-quiz">
            <span class="icon">⚡</span>
            <div class="title">クイズ</div>
            <div class="desc">4択に答えてXPを稼ぐ。テンポよく実力チェック</div>
          </button>
          <button class="mode-card" id="mode-exam" style="grid-column: 1 / -1;">
            <span class="icon">📝</span>
            <div class="title">問題演習</div>
            <div class="desc">オリジナル問題180問・公式公開問題の解答記録・間違い直しはこちら</div>
          </button>
        </div>

        <div class="section-title">カテゴリを選ぶ</div>
        <div class="cat-list">${catRows}</div>
      </div>
    `);

    wrap.querySelectorAll(".cat-row").forEach(row => {
      row.addEventListener("click", () => selectCategory(row.dataset.cat));
    });
    wrap.querySelector("#mode-drill").addEventListener("click", startDrill);
    wrap.querySelector("#mode-flash").addEventListener("click", startFlashcards);
    wrap.querySelector("#mode-quiz").addEventListener("click", startQuiz);
    wrap.querySelector("#mode-exam").addEventListener("click", () => {
      if (window.HSKExam) window.HSKExam.open();
    });
    wrap.querySelector("#open-progress").addEventListener("click", () => {
      state.screen = "progress";
      render();
    });

    const genSyncBtn = wrap.querySelector("#gen-sync");
    if (genSyncBtn) genSyncBtn.addEventListener("click", startNewSync);
    const linkSyncBtn = wrap.querySelector("#link-sync");
    if (linkSyncBtn) linkSyncBtn.addEventListener("click", () => {
      const text = wrap.querySelector("#sync-input").value;
      if (text.trim()) linkSync(text);
      else showToast("コードを入力してください");
    });
    const unlinkSyncBtn = wrap.querySelector("#unlink-sync");
    if (unlinkSyncBtn) unlinkSyncBtn.addEventListener("click", unlinkSync);
    const copySyncBtn = wrap.querySelector("#copy-sync");
    if (copySyncBtn) copySyncBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(state.syncCode);
        showToast("コピーしました ✓");
      } catch (e) {
        showToast("手動で選択してコピーしてください");
      }
    });

    const openBtn = wrap.querySelector("#open-backup");
    if (openBtn) openBtn.addEventListener("click", () => { state.backupOpen = true; render(); });
    const closeBtn = wrap.querySelector("#close-backup");
    if (closeBtn) closeBtn.addEventListener("click", () => { state.backupOpen = false; render(); });
    const copyBtn = wrap.querySelector("#copy-btn");
    if (copyBtn) copyBtn.addEventListener("click", async () => {
      const text = wrap.querySelector("#export-area").value;
      try {
        await navigator.clipboard.writeText(text);
        showToast("コピーしました ✓");
      } catch (e) {
        const area = wrap.querySelector("#export-area");
        area.select();
        showToast("手動で選択してコピーしてください");
      }
    });
    const restoreBtn = wrap.querySelector("#restore-btn");
    if (restoreBtn) restoreBtn.addEventListener("click", () => {
      const text = wrap.querySelector("#import-area").value;
      if (text.trim()) importCode(text);
      else showToast("コードを貼り付けてください");
    });
    return wrap;
  }

  function renderFlashcard() {
    const card = state.deck[state.idx];
    const wrap = el(`
      <div>
        <div class="study-header">
          <button class="back-link" id="back">← 戻る</button>
          ${miniLevelHtml()}
          <div class="deck-pos">${state.idx+1} / ${state.deck.length}</div>
        </div>
        <div class="progress-track" style="margin-bottom:20px;">
          <div class="progress-fill" style="width:${((state.idx)/state.deck.length)*100}%"></div>
        </div>
        <div class="flashcard-wrap">
          <div class="flashcard ${state.flipped?'flipped':''}" id="card">
            <div class="face front">
              <div class="hanzi">${card.h}</div>
              <div class="pinyin">${card.p}</div>
              <div class="tap-hint">タップして意味を見る</div>
            </div>
            <div class="face back">
              <div class="meaning">${card.m}</div>
              <div class="category-tag">${card.c}</div>
            </div>
          </div>
        </div>
        <div class="rate-row">
          <button class="rate-btn again" id="again">もう一度</button>
          <button class="rate-btn got-it" id="gotit">覚えた ✓</button>
        </div>
      </div>
    `);
    wrap.querySelector("#back").addEventListener("click", goHome);
    wrap.querySelector("#card").addEventListener("click", flipCard);
    wrap.querySelector("#again").addEventListener("click", (e) => { e.stopPropagation(); rateCard(false); });
    wrap.querySelector("#gotit").addEventListener("click", (e) => { e.stopPropagation(); rateCard(true); });
    return wrap;
  }

  function renderQuiz() {
    const { questions, idx, score, answered, selected } = state.quiz;
    const current = questions[idx];

    const optionsHtml = current.options.map(opt => {
      let cls = "option-btn";
      if (answered) {
        if (opt.h === current.q.h) cls += " correct";
        else if (opt.h === selected) cls += " wrong";
      }
      return `<button class="${cls}" data-h="${opt.h}" ${answered?'disabled':''}>${opt.m}</button>`;
    }).join("");

    const wrap = el(`
      <div>
        <div class="study-header">
          <button class="back-link" id="back">← 戻る</button>
          ${miniLevelHtml()}
          <div class="deck-pos">${idx+1} / ${questions.length}</div>
        </div>
        <div class="quiz-progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${(idx/questions.length)*100}%"></div></div>
          <div class="score-badge">正解 ${score}</div>
        </div>
        <div class="quiz-question">
          <div class="hanzi">${current.q.h}</div>
          <div class="pinyin">${current.q.p}</div>
          <div class="quiz-prompt">この意味はどれ？</div>
        </div>
        <div class="option-list">${optionsHtml}</div>
        ${answered ? '<button class="next-btn" id="next">次へ</button>' : ''}
      </div>
    `);
    wrap.querySelector("#back").addEventListener("click", goHome);
    wrap.querySelectorAll(".option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const opt = current.options.find(o => o.h === btn.dataset.h);
        answerQuiz(opt);
      });
    });
    if (answered) wrap.querySelector("#next").addEventListener("click", nextQuizQuestion);
    return wrap;
  }

  function renderQuizResult() {
    const { score, questions } = state.quiz;
    const pct = Math.round((score/questions.length)*100);
    let msg = "その調子！";
    let emoji = "🙂";
    if (pct === 100) { msg = "パーフェクト！！"; emoji = "🏆"; }
    else if (pct >= 80) { msg = "とても良い出来です"; emoji = "🎉"; }
    else if (pct >= 50) { msg = "順調に伸びています"; emoji = "💪"; }
    else { msg = "もう一周してみましょう"; emoji = "📚"; }

    const wrap = el(`
      <div>
        <div class="result-wrap">
          <div class="big-emoji">${emoji}</div>
          <div class="result-msg">${msg}</div>
          <div class="result-sub">${questions.length}問中 ${score}問正解（正答率${pct}%）</div>
          <div class="result-stats">
            <div><div class="stat-num">+${score*15}</div><div class="stat-label">獲得XP</div></div>
            <div><div class="stat-num">${state.xp}</div><div class="stat-label">総XP</div></div>
          </div>
          <button class="start-btn" id="retry">もう一度クイズ</button>
          <button class="back-link" id="home2" style="margin-top:10px;">ホームに戻る</button>
        </div>
      </div>
    `);
    wrap.querySelector("#retry").addEventListener("click", startQuiz);
    wrap.querySelector("#home2").addEventListener("click", goHome);
    return wrap;
  }

  function renderDrill() {
    const card = state.drillQueue[0];
    const done = state.drillTotal - state.drillQueue.length;
    const wrap = el(`
      <div>
        <div class="study-header">
          <button class="back-link" id="back">← 戻る</button>
          ${miniLevelHtml()}
          <div class="deck-pos">残り ${state.drillQueue.length}語</div>
        </div>
        <div class="drill-banner">🔥 特訓モード — 習得 ${done} / ${state.drillTotal}語</div>
        <div class="progress-track" style="margin-bottom:20px;">
          <div class="progress-fill drill" style="width:${(done/state.drillTotal)*100}%"></div>
        </div>
        <div class="flashcard-wrap">
          <div class="flashcard drill-card ${state.flipped?'flipped':''}" id="card">
            <div class="face front">
              <div class="hanzi">${card.h}</div>
              <div class="pinyin">${card.p}</div>
              <div class="tap-hint">タップして意味を見る</div>
            </div>
            <div class="face back">
              <div class="meaning">${card.m}</div>
              <div class="category-tag">${card.c}</div>
            </div>
          </div>
        </div>
        <div class="rate-row">
          <button class="rate-btn again" id="again">まだ</button>
          <button class="rate-btn got-it" id="gotit">覚えた✓</button>
        </div>
      </div>
    `);
    wrap.querySelector("#back").addEventListener("click", goHome);
    wrap.querySelector("#card").addEventListener("click", flipCard);
    wrap.querySelector("#again").addEventListener("click", (e) => { e.stopPropagation(); drillAnswer(false); });
    wrap.querySelector("#gotit").addEventListener("click", (e) => { e.stopPropagation(); drillAnswer(true); });
    return wrap;
  }

  // ---------------------------------------------------------------
  // 全体の進捗（問題演習の記録は exam.js の localStorage を直接読む）
  // ---------------------------------------------------------------
  function pad2(n) { return String(n).padStart(2, "0"); }

  function computeMockScoreFromAttempts(mockPrefix) {
    let store;
    try { store = JSON.parse(localStorage.getItem("hsk-exam-attempts-v1") || "{}"); } catch (e) { store = {}; }
    let listeningCorrect = 0, readingCorrect = 0, attempted = 0, lastAt = 0;
    for (let n = 1; n <= 60; n++) {
      const id = mockPrefix + "-" + pad2(n);
      const entry = store[id];
      if (!entry || !entry.history || !entry.history.length) return null;
      attempted++;
      const latest = entry.history[entry.history.length - 1];
      lastAt = Math.max(lastAt, latest.submitted_at || 0);
      if (n <= 35) { if (latest.is_correct) listeningCorrect++; }
      else { if (latest.is_correct) readingCorrect++; }
    }
    const score = Math.round((100 * listeningCorrect / 35 + 100 * readingCorrect / 25) * 10) / 10;
    return { listeningCorrect, readingCorrect, score, lastAt };
  }

  function getOfficialResults() {
    let store;
    try { store = JSON.parse(localStorage.getItem("hsk-exam-official-v1") || "{}"); } catch (e) { store = {}; }
    return store;
  }

  function getExamBankStats() {
    let store;
    try { store = JSON.parse(localStorage.getItem("hsk-exam-attempts-v1") || "{}"); } catch (e) { store = {}; }
    const ids = Object.keys(store);
    let correct = 0;
    ids.forEach((id) => {
      const entry = store[id];
      if (entry && entry.history && entry.history.length) {
        const latest = entry.history[entry.history.length - 1];
        if (latest.is_correct) correct++;
      }
    });
    return { attempted: ids.length, correct: correct, total: 180 };
  }

  function renderProgress() {
    const totalProg = categoryProgress("すべて");
    const pct = Math.round((totalProg.known / totalProg.total) * 100);
    const lvl = levelInfo(state.xp);
    const bankStats = getExamBankStats();
    const officialStore = getOfficialResults();
    const officialPapers = [
      { id: "H20901", title: "公式公開問題 H20901" },
      { id: "H20902", title: "公式公開問題 H20902" }
    ];

    const mockRows = ["M1", "M2", "M3"].map((m) => {
      const r = computeMockScoreFromAttempts(m);
      const label = { M1: "第1回", M2: "第2回", M3: "第3回" }[m];
      if (!r) return `<div class="exam-wrong-row"><span class="zh">${label}（60問の形式練習）</span><span class="meta">未挑戦 / 進行中</span></div>`;
      return `<div class="exam-wrong-row"><span class="zh">${label}（60問の形式練習）</span><span class="meta">自己採点の目安 ${r.score.toFixed(1)}（聞${r.listeningCorrect}/35・読${r.readingCorrect}/25）</span></div>`;
    }).join("");

    const officialRows = officialPapers.map((p) => {
      const rec = officialStore[p.id];
      const res = rec && (rec.lastResult || rec.firstSeen);
      if (!res || res.score === null || res.score === undefined) {
        return `<div class="exam-wrong-row"><span class="zh">${p.title}</span><span class="meta">未挑戦 / 未完了</span></div>`;
      }
      return `<div class="exam-wrong-row"><span class="zh">${p.title}</span><span class="meta">自己採点の目安 ${res.score.toFixed(1)}（聞${res.listeningCorrect}/35・読${res.readingCorrect}/25）</span></div>`;
    }).join("");

    const catRows = CATEGORIES.filter((c) => c !== "すべて").map((cat) => {
      const prog = categoryProgress(cat);
      const cpct = prog.total ? Math.round((prog.known / prog.total) * 100) : 0;
      return `<div class="exam-wrong-row"><span class="zh">${cat}</span><span class="meta">${prog.known}/${prog.total}語（${cpct}%）</span></div>`;
    }).join("");

    const wrap = el(`
      <div>
        <div class="study-header">
          <button class="back-link" id="back">← 戻る</button>
          <div class="deck-pos">全体の進捗</div>
        </div>

        <div class="level-card">
          <div class="row">
            <div class="lv-wrap"><span class="lv">Lv.${lvl.level}</span><span class="streak">🔥 ${state.streak}日連続</span></div>
            <div class="xp-num">総XP ${state.xp}</div>
          </div>
          <div class="level-bar-track"><div class="level-bar-fill" style="width:${lvl.pct}%"></div></div>
        </div>

        <div class="section-title">単語学習（カテゴリ別）</div>
        <div class="exam-wrong-list">
          <div class="exam-wrong-row"><span class="zh">全体</span><span class="meta">${totalProg.known}/${totalProg.total}語（${pct}%）</span></div>
          ${catRows}
        </div>

        <div class="section-title">問題演習（オリジナル180問）</div>
        <div class="exam-wrong-list">
          <div class="exam-wrong-row"><span class="zh">解答済み問題</span><span class="meta">${bankStats.attempted}/${bankStats.total}問</span></div>
          <div class="exam-wrong-row"><span class="zh">直近の正解数</span><span class="meta">${bankStats.correct}/${bankStats.attempted || 0}問</span></div>
        </div>

        <div class="section-title">自己採点の目安（60問モード）</div>
        <div class="exam-wrong-list">${mockRows}</div>

        <div class="section-title">自己採点の目安（公式公開問題）</div>
        <div class="exam-wrong-list">${officialRows}</div>

        <div class="exam-disclaimer" style="margin-top:4px;">自己採点の目安は本番の確定点・合否を保証するものではありません。60問または公式問題の聞き取り・読解を両方解答した場合にのみ表示されます。</div>
      </div>
    `);
    wrap.querySelector("#back").addEventListener("click", goHome);
    return wrap;
  }

  function render() {
    const root = document.getElementById("hsk-root");
    if (!state.loaded) {
      root.innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-soft);">読み込み中...</div>';
      return;
    }
    root.innerHTML = "";
    let content;
    if (state.screen === "home") content = renderHome();
    else if (state.screen === "flashcard") content = renderFlashcard();
    else if (state.screen === "quiz") content = renderQuiz();
    else if (state.screen === "quizResult") content = renderQuizResult();
    else if (state.screen === "drill") content = renderDrill();
    else if (state.screen === "progress") content = renderProgress();
    root.appendChild(content);

    if (!document.getElementById("hsk-toast")) {
      const toast = document.createElement("div");
      toast.id = "hsk-toast";
      toast.className = "toast";
      document.body.appendChild(toast);
    }
  }

  loadProgress();

  function addExternalXp(amount) {
    gainXp(amount);
    saveProgress();
  }

  window.HSKApp = { goHome: goHome, gainXp: addExternalXp };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
})();
</script>
<script src="exam.js"></script>
</body>
</html>
